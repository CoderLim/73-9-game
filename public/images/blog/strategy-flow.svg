<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">73-9 game strategy flow</title>
  <desc id="desc">A four-step diagram showing a 100 million dollar budget, five team-season spins, five signings, and an 82-game simulation.</desc>
  <rect width="1200" height="630" fill="#070811"/>
  <text x="70" y="95" fill="#ffce54" font-family="Arial, sans-serif" font-size="42" font-weight="700">73-9 GAME STRATEGY</text>
  <text x="70" y="140" fill="#a7a7c2" font-family="Arial, sans-serif" font-size="24">Verified game flow at 73-9.org</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(70 210)"><rect width="230" height="220" rx="24" fill="#111426" stroke="#fd6a00"/><text x="115" y="72" fill="#fd6a00" font-size="42" font-weight="700">$100M</text><text x="115" y="116" fill="#fff" font-size="24">Starting budget</text><text x="115" y="160" fill="#9696b5" font-size="19">One shared bankroll</text></g>
    <g transform="translate(340 210)"><rect width="230" height="220" rx="24" fill="#111426" stroke="#fd6a00"/><text x="115" y="72" fill="#fd6a00" font-size="42" font-weight="700">5</text><text x="115" y="116" fill="#fff" font-size="24">Team-season spins</text><text x="115" y="160" fill="#9696b5" font-size="19">1990 to today</text></g>
    <g transform="translate(610 210)"><rect width="230" height="220" rx="24" fill="#111426" stroke="#fd6a00"/><text x="115" y="72" fill="#fd6a00" font-size="42" font-weight="700">5</text><text x="115" y="116" fill="#fff" font-size="24">Player signings</text><text x="115" y="160" fill="#9696b5" font-size="19">Stay under budget</text></g>
    <g transform="translate(880 210)"><rect width="230" height="220" rx="24" fill="#111426" stroke="#fd6a00"/><text x="115" y="72" fill="#fd6a00" font-size="42" font-weight="700">82</text><text x="115" y="116" fill="#fff" font-size="24">Game simulation</text><text x="115" y="160" fill="#9696b5" font-size="19">Then face the 73-9 wall</text></g>
  </g>
  <text x="70" y="540" fill="#777795" font-family="Arial, sans-serif" font-size="18">Source: 73-9.org and HoopsMatic 73-9 Game rules</text>
</svg>