<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Historic NBA team comparison</title>
  <desc id="desc">A comparison of the 1995-96 Bulls, 2015-16 Warriors, and 2016-17 Warriors using regular-season records and championship outcomes.</desc>
  <rect width="1200" height="630" fill="#070811"/>
  <text x="70" y="90" fill="#ffce54" font-family="Arial, sans-serif" font-size="40" font-weight="700">THREE HISTORIC BENCHMARKS</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(70 170)"><rect width="320" height="300" rx="24" fill="#111426" stroke="#5c5c78"/><text x="160" y="60" fill="#fff" font-size="27" font-weight="700">1995-96 Bulls</text><text x="160" y="135" fill="#fd6a00" font-size="48" font-weight="800">72-10</text><text x="160" y="190" fill="#a7a7c2" font-size="22">NBA champions</text><text x="160" y="235" fill="#777795" font-size="18">15-3 playoffs</text></g>
    <g transform="translate(440 170)"><rect width="320" height="300" rx="24" fill="#111426" stroke="#ffce54"/><text x="160" y="60" fill="#fff" font-size="27" font-weight="700">2015-16 Warriors</text><text x="160" y="135" fill="#ffce54" font-size="48" font-weight="800">73-9</text><text x="160" y="190" fill="#a7a7c2" font-size="22">Lost NBA Finals 3-4</text><text x="160" y="235" fill="#777795" font-size="18">Regular-season wins record</text></g>
    <g transform="translate(810 170)"><rect width="320" height="300" rx="24" fill="#111426" stroke="#5c5c78"/><text x="160" y="60" fill="#fff" font-size="27" font-weight="700">2016-17 Warriors</text><text x="160" y="135" fill="#fd6a00" font-size="48" font-weight="800">67-15</text><text x="160" y="190" fill="#a7a7c2" font-size="22">NBA champions</text><text x="160" y="235" fill="#777795" font-size="18">16-1 playoffs</text></g>
  </g>
  <text x="70" y="565" fill="#777795" font-family="Arial, sans-serif" font-size="18">Sources: NBA season reviews and NBA historical team/playoff records.</text>
</svg>